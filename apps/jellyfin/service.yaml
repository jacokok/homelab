---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
    # LAN client auto-discovery (mirrors the 7359/udp port from compose).
    - name: discovery
      port: 7359
      targetPort: discovery
      protocol: UDP
