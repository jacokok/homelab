---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  chart:
    spec:
      chart: jellyfin
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
      version: 3.2.0
  interval: 1h
  timeout: 15m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    force: true
  values:
    image:
      tag: 10.11.11
    service:
      type: ClusterIP
      port: 8096
    ingress:
      enabled: false
    jellyfin:
      env:
        - name: JELLYFIN_PublishedServerUrl
          value: jellyfin.doink.co.za
    persistence:
      config:
        enabled: true
        existingClaim: jellyfin-config
      media:
        enabled: false
      cache:
        enabled: false
    # Hardware acceleration (see https://jellyfin.org/docs/general/installation/advanced/kubernetes/#hardware-acceleration)
    # AMD RX 6600 -> VA-API via /dev/dri/renderD128. Requires a node with the GPU (earth).
    # NOTE: the docs' gpu.intel.com/i915 limit is omitted - it needs the Intel device plugin and this is an AMD card.
    securityContext:
      privileged: true
    volumes:
      - name: files
        persistentVolumeClaim:
          claimName: files
      - name: dri
        hostPath:
          path: /dev/dri
    volumeMounts:
      - name: files
        mountPath: /external/series
        subPath: series
      - name: files
        mountPath: /external/movies
        subPath: movies
      - name: dri
        mountPath: /dev/dri
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - earth
