---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-documents
spec:
  capacity:
    storage: 10Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: nas.lan
    path: /volume1/files/documents
    readOnly: false
  mountOptions:
    - nfsvers=4
    - soft
